---
name: Publish

"on":
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  on-main:
    name: Verify tag is on main
    if: github.repository == 'BlockedPath/pi-meta-oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Full history and every branch, so origin/main exists to compare.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf '::error::Tagged commit %s is not on main\n' "$GITHUB_SHA"
            exit 1
          fi

  verify:
    name: Verify package
    if: github.repository == 'BlockedPath/pi-meta-oauth'
    permissions:
      contents: read
    uses: ./.github/workflows/pi-compatibility.yml
    with:
      bun-no-cache: true

  publish:
    name: Publish to npm
    needs:
      - on-main
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf '::error::Release tag %s must match %s\n' \
              "$RELEASE_TAG" "$expected_tag"
            exit 1
          fi

      - name: Check npm registry
        id: registry
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          published_sha="$(
            npm view "$package_spec" gitHead 2>/dev/null || true
          )"
          if [[ -z "$published_sha" ]]; then
            echo 'already_published=false' >> "$GITHUB_OUTPUT"
          elif [[ "$published_sha" == "$GITHUB_SHA" ]]; then
            printf '::notice::%s already published from this commit\n' \
              "$package_spec"
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
          else
            printf '::error::%s was published from commit %s\n' \
              "$package_spec" "$published_sha"
            exit 1
          fi

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish --access public --provenance

  publish-github:
    name: Publish to GitHub Packages
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@blockedpath"

      - name: Set scoped package name
        run: npm pkg set name="@blockedpath/pi-meta-oauth"

      - name: Check GitHub Packages registry
        id: github-registry
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          published_sha="$(
            npm view "$package_spec" gitHead 2>/dev/null || true
          )"
          if [[ -z "$published_sha" ]]; then
            echo 'already_published=false' >> "$GITHUB_OUTPUT"
          elif [[ "$published_sha" == "$GITHUB_SHA" ]]; then
            printf '::notice::%s already published from this commit\n' \
              "$package_spec"
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
          else
            printf '::error::%s was published from commit %s\n' \
              "$package_spec" "$published_sha"
            exit 1
          fi

      - name: Inspect GitHub package contents
        run: npm pack --dry-run

      - name: Publish GitHub package
        if: steps.github-registry.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish

  release:
    name: Create GitHub Release
    needs:
      - publish
      - publish-github
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf '::notice::GitHub Release %s already exists\n' \
              "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
