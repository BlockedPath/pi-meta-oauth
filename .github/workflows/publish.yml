---
name: Publish

"on":
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    if: github.repository == 'BlockedPath/pi-meta-oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --no-save

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf '::error::Release tag %s must match %s\n' \
              "$RELEASE_TAG" "$expected_tag"
            exit 1
          fi

      - name: Check npm registry
        id: registry
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          published_sha="$(
            npm view "$package_spec" gitHead 2>/dev/null || true
          )"
          if [[ -z "$published_sha" ]]; then
            echo 'already_published=false' >> "$GITHUB_OUTPUT"
          elif [[ "$published_sha" == "$GITHUB_SHA" ]]; then
            printf '::notice::%s already published from this commit\n' \
              "$package_spec"
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
          else
            printf '::error::%s was published from commit %s\n' \
              "$package_spec" "$published_sha"
            exit 1
          fi

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf '::notice::GitHub Release %s already exists\n' \
              "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
