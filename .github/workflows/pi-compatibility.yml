---
name: Pi compatibility

# Shared by CI and Publish, so a release is verified against every supported
# Pi line and not only the lockfile's.
"on":
  workflow_call:
    inputs:
      bun-no-cache:
        description: Skip the Bun download cache (release builds).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Pi ${{ matrix.pi-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # "lockfile" tests the committed dev pin as installed; every other leg
        # reinstalls that Pi version over it.
        pi-version:
          ["0.83.0", "0.84.0", "0.85.0", "0.86.0", "0.87.1", "lockfile"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: ${{ inputs.bun-no-cache }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install compatibility peers
        if: matrix.pi-version != 'lockfile'
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: >-
          bun add --dev --no-save
          "@earendil-works/pi-ai@${PI_VERSION}"
          "@earendil-works/pi-coding-agent@${PI_VERSION}"

      - name: Lint, typecheck, and test
        run: bun run check
